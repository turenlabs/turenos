[package]
name = "turen-fuzzy-hash-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded cryptographic and similarity hashing WebAssembly wrapper for Turen"
repository = "https://github.com/turenio/wasm-tools"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "=1.8.7"
fuzzyhash = "=0.2.2"
goblin = { version = "=0.10.7", default-features = false, features = ["pe32", "pe64"] }
md-5 = "=0.11.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha1 = "=0.11.0"
sha2 = "=0.11.0"
tlsh2 = { version = "=1.1.0", features = ["diff"] }
wasm-bindgen = "=0.2.108"
xxhash-rust = { version = "=0.8.18", features = ["xxh64"] }

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
