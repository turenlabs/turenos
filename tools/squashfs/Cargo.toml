[package]
name = "turen-squashfs-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded SquashFS listing and single-entry extraction WebAssembly module for Turen"
repository = "https://github.com/turenio/wasm-tools"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pure-Rust closure only: gzip (flate2+zlib-rs), lz4 (lz4_flex), and v3 image
# support are enabled. backhand's xz (C liblzma), zstd (C zstd-sys), lzo (GPL),
# v3_lzma/v4_lzma (GPL C++ lzma-adaptive-sys), and parallel (rayon) features are
# intentionally off; affected images report unsupported_compression.
# backhand v0.25.3 at commit eccf81b6f599cb90245d7c9694e95ee6023cad06 plus
# patches/0001-wasm-osstr.patch; run script/import-upstream.sh to populate
# upstream/ before building. See SOURCE.json.
backhand = { path = "upstream/backhand", default-features = false, features = ["gzip", "lz4", "v3", "error-strings"] }
data-encoding = "=2.11.1"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
wasm-bindgen = "=0.2.108"

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
