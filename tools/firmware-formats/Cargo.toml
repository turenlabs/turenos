[package]
name = "turen-firmware-formats-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded embedded/firmware format decoders (DTB, U-Boot, Intel HEX, S-Record, Android sparse) for Turen"
repository = "https://github.com/turenio/wasm-tools"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "=1.0.145"
wasm-bindgen = "=0.2.108"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
