[package]
name = "turen-rebuild-timeline-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded forensic timeline rebuild for Turen"
repository = "https://github.com/turenlabs/turenos"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
bodyfile = "0.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "0.2.108"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
