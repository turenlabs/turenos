[package]
name = "turen-sourcemap-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded source-map decoding and lookup WebAssembly wrapper for Turen"
repository = "https://github.com/turenio/wasm-tools"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sourcemap = "=9.3.2"
# Constrains the transitive `url` dependency (used by the sourcemap crate for
# section-reference resolution, which this wrapper never calls) below the
# idna 1.x / ICU4X data dependency tree.
url = "=2.4.1"
wasm-bindgen = "=0.2.108"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
