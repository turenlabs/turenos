[package]
name = "turen-binary-diff-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded binary differencing and patching WebAssembly wrapper for Turen"
repository = "https://github.com/turenio/wasm-tools"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bipatch = "=1.0.0"
byteorder = "=1.5.0"
data-encoding = "=2.11.1"
divsufsort = "=2.0.0"
integer-encoding = "=2.1.3"
sacabase = "=2.0.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
wasm-bindgen = "=0.2.108"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
