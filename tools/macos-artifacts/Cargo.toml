[package]
name = "turen-macos-artifacts-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded offline macOS forensic artifact parser WebAssembly module for Turen"
repository = "https://github.com/turenio/wasm-tools"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
macos-unifiedlogs = "=0.6.0"
plist = { version = "=1.10.1", features = [
    "enable_unstable_features_that_may_break_with_minor_version_bumps",
] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
wasm-bindgen = "=0.2.108"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
