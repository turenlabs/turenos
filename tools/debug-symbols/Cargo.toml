[package]
name = "turen-debug-symbols-wasm"
version = "0.1.0"
edition = "2021"
description = "Bounded DWARF, PDB, and symbol inspection for Turen agents"
repository = "https://github.com/turenio/wasm-tools"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cpp_demangle = { version = "0.5.1", default-features = false, features = ["alloc"] }
gimli = { version = "0.34.0", default-features = false, features = ["read"] }
msvc-demangler = { version = "0.11.0", default-features = false }
object = { version = "0.37.3", default-features = false, features = ["read_core", "read", "elf", "pe", "macho", "coff"] }
pdb = "0.8.0"
rustc-demangle = "0.1.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
