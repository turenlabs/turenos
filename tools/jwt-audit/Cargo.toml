[package]
name = "turen-jwt-audit-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded offline JWT inspection and public-key signature verification for defenders"
repository = "https://github.com/turenlabs/turenos"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.22.1"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
rsa = { version = "=0.9.10", default-features = false, features = ["sha2", "u64_digit"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.10.9", default-features = false, features = ["oid"] }
wasm-bindgen = "=0.2.108"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
