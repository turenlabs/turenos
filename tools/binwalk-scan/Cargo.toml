[package]
name = "turen-binwalk-scan-wasm"
version = "0.1.0"
edition = "2021"
description = "Bounded scan-only firmware signature detection for Turen"
repository = "https://github.com/turenio/wasm-tools"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
