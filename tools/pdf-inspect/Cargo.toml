[package]
name = "turen-pdf-inspect-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded offline PDF structure inspection WebAssembly wrapper for Turen"
repository = "https://github.com/turenio/wasm-tools"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lopdf = { version = "=0.45.0", default-features = false, features = ["wasm_js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11"
wasm-bindgen = "0.2.108"

[dev-dependencies]
weezl = "0.2"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
