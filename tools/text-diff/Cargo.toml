[package]
name = "turen-text-diff-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded line differencing and unified patches WebAssembly wrapper for Turen"
repository = "https://github.com/turenlabs/turenos"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
similar = { version = "=2.7.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wasm-bindgen = "=0.2.127"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
