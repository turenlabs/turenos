[package]
name = "turen-json-query-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded jq-style JSON querying WebAssembly wrapper for Turen"
repository = "https://github.com/turenio/wasm-tools"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jaq-core = "=3.1.1"
jaq-json = "=2.0.3"
jaq-std = "=3.0.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["unbounded_depth"] }
wasm-bindgen = "=0.2.127"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
