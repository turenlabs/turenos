[package]
name = "turen-sqlite-inspect-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded offline SQLite 3 database file forensics WebAssembly module for Turen"
repository = "https://github.com/turenlabs/turenos"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Hand-rolled SQLite file-format parser; no C dependency. serde for options,
# serde_json for bounded reports, sha2 for blob previews, wasm-bindgen ABI.
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
wasm-bindgen = "=0.2.108"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
