[package]
name = "turen-static-analysis-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded static analysis WebAssembly operations for Turen"
repository = "https://github.com/turenio/wasm-tools"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
blake3 = "1.8.2"
cfb = "0.10.0"
cpp_demangle = "0.4.4"
crc32fast = "1.5.0"
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
goblin = "0.10.1"
hex = "0.4.3"
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
infer = "0.22.0"
kamadak-exif = "0.6.1"
md-5 = "0.10.6"
plist = "1.7.4"
quick-xml = "=0.38.3"
rustc-demangle = "0.1.24"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.9"
tar = "0.4.44"
tlsh2 = "1.1.0"
wasm-bindgen = "0.2.108"
x509-parser = "0.17.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
yaxpeax-arm = "=0.4.0"
yaxpeax-arch = "=0.3.2"
sevenz-rust = { version = "=0.6.1", path = "vendor/sevenz-rust", default-features = false }

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
