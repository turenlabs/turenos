[package]
name = "turen-minidump-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded offline Windows minidump and Breakpad crash dump parser for Turen"
repository = "https://github.com/turenio/wasm-tools"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
minidump = "=0.27.0"
minidump-common = "=0.27.0"
num-traits = "=0.2.19"
procfs-core = "=0.18.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
wasm-bindgen = "=0.2.108"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
