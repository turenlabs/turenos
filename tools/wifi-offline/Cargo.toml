[package]
name = "turen-wifi-offline-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline 802.11 capture summary for Turen"
repository = "https://github.com/turenlabs/turenos"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "0.2.108"
ieee80211 = "0.5.9"
pcap-file = "=3.0.0-rc.3"
radiotap = "1.3.0"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
