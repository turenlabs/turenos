[package]
name = "turen-wasm-toolkit-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded deep WebAssembly toolkit (print, analyze, metadata, wat compile) for Turen"
repository = "https://github.com/turenlabs/turenos"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
wasm-bindgen = "=0.2.108"
wasm-metadata = { version = "=0.259.0", default-features = false }
wasmparser = { version = "=0.259.0", default-features = false, features = ["std", "validate", "component-model", "features", "simd"] }
wasmprinter = "=0.259.0"
wast = "=259.0.0"
wat = "=1.259.0"

[dev-dependencies]
wasm-encoder = "=0.259.0"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
