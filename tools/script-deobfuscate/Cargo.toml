[package]
name = "turen-script-deobfuscate-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded static JavaScript deobfuscation for TurenOS"
repository = "https://github.com/turenlabs/turenos"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxc_allocator = "=0.152.0"
oxc_ast = "=0.152.0"
oxc_ast_visit = "=0.152.0"
oxc_parser = { version = "=0.152.0", default-features = false }
oxc_codegen = "=0.152.0"
oxc_span = "=0.152.0"
base64 = "=0.22.1"
dragonbox_ecma = "=0.1.12"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
wasm-bindgen = "=0.2.127"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
