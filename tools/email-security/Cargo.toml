[package]
name = "turen-email-security-wasm"
version = "0.1.0"
edition = "2024"
description = "Bounded RFC 5322 and MIME email security analysis for TurenOS"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/turenio/wasm-tools"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ammonia = "4.1.4"
mail-parser = { version = "0.11.8", default-features = false, features = ["full_encoding"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
