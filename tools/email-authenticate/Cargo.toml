[package]
name = "turen-email-authenticate-wasm"
version = "0.1.0"
edition = "2024"
description = "Offline, bounded email authentication evidence for Turen agents"
repository = "https://github.com/turenio/wasm-tools"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[patch.crates-io]
mail-auth = { path = "vendor/mail-auth" }

[dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
hex = "0.4"
mail-auth = { version = "=0.12.1", default-features = false, features = ["rust-crypto", "dns-offline"] }
mail-parser = { version = "=0.11.8", default-features = false, features = ["full_encoding"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
wasm-bindgen = "0.2"
web-time = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
