[package]
name = "turen-apk-dex-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded Android APK/DEX static inspection WebAssembly wrapper for Turen"
repository = "https://github.com/turenlabs/turenos"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# flate2 rust_backend pins the pure-Rust miniz_oxide DEFLATE backend that the
# zip deflate-flate2 feature leaves unselected.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
wasm-bindgen = "=0.2.108"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
