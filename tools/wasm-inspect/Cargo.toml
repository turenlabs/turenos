[package]
name = "turen-wasm-inspect-wasm"
version = "0.1.0"
edition = "2021"
description = "Bounded static WebAssembly module inspection for Turen"
repository = "https://github.com/turenlabs/turenos"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasmparser = { version = "0.239", default-features = false, features = ["std", "validate", "component-model"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
