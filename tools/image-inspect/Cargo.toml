[package]
name = "turen-image-inspect-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded offline image/container metadata inspection WebAssembly module for Turen"
repository = "https://github.com/turenlabs/turenos"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32fast = "=1.5.2"
exif = { version = "=0.6.1", package = "kamadak-exif" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
wasm-bindgen = "=0.2.108"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
