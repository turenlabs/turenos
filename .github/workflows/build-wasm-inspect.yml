name: Build wasm-inspect WASM

on:
  push:
    branches: [dev, main]
    paths:
      - ".github/workflows/build-wasm-inspect.yml"
      - "tools/wasm-inspect/**"
  workflow_dispatch:

concurrency:
  group: wasm-wasm-inspect
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  RUST_TOOLCHAIN: 1.94.0
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: Set up Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24
      - name: Install wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"
      - name: Build
        run: wasm-pack build tools/wasm-inspect --target web --release --out-dir pkg
      - name: Verify
        run: node tools/wasm-inspect/test/verify.mjs tools/wasm-inspect/pkg
      - name: Pack
        run: node tools/wasm-inspect/script/pack.mjs tools/wasm-inspect/pkg packages/wasm-inspect-wasm
      - name: Verify package hashes
        working-directory: packages/wasm-inspect-wasm
        run: shasum -a 256 -c SHA256SUMS

      - name: Open package update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: packages/wasm-inspect-wasm
          branch: wasm/wasm-inspect-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild wasm-inspect-wasm"
          title: "chore(wasm): rebuild wasm-inspect-wasm"
          body: "Rebuilt `packages/wasm-inspect-wasm` from `tools/wasm-inspect` at ${{ github.sha }}."
