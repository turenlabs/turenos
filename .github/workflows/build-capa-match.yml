name: Build capa-match WASM

on:
  push:
    branches: [main]
    paths:
      - "tools/capa-match/**"
  workflow_dispatch:

concurrency:
  group: wasm-capa-match
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: write

env:
  GOBLIN_COMMIT: cec6e6eba5bdcec78ec79edc80b3a1f44856039a
  RUST_TOOLCHAIN: 1.97.1
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout Turen build repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Checkout Goblin
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: m4b/goblin
          ref: ${{ env.GOBLIN_COMMIT }}
          path: upstream/goblin
          persist-credentials: false

      - name: Import pinned capa-rules ruleset
        run: tools/capa-match/script/import-upstream.sh

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24

      - name: Install pinned wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - name: Run Rust tests
        run: cargo +"$RUST_TOOLCHAIN" test --manifest-path tools/capa-match/Cargo.toml --locked

      - name: Build capa-match WASM
        run: wasm-pack build tools/capa-match --target web --release --out-dir pkg
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}

      - name: Pack Forge workspace artifact
        run: node tools/capa-match/script/pack.mjs tools/capa-match/pkg packages/capa-match-wasm

      - name: Verify packaged matcher API
        run: node tools/capa-match/test/verify.mjs packages/capa-match-wasm/dist

      - name: Verify artifact checksums
        run: cd packages/capa-match-wasm && (shasum -a 256 -c SHA256SUMS || sha256sum -c SHA256SUMS)

      - name: Open package update PR
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          sign-commits: true
          add-paths: packages/capa-match-wasm
          branch: wasm/capa-match-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild capa-match-wasm"
          title: "chore(wasm): rebuild capa-match-wasm"
          body: "Rebuilt `packages/capa-match-wasm` from `tools/capa-match` at ${{ github.sha }}."
      - name: Report required lint status
        # Artifact PRs are authored by github-actions[bot]; pull_request runs on
        # them always require maintainer approval, and paths-ignore keeps the
        # standard suite off packages/*-wasm diffs. Report the build's own
        # SHA256SUMS verification under the required check name instead.
        if: steps.cpr.outputs.pull-request-head-sha != ''
        env:
          GH_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/check-run.json" <<EOF
          {"name":"lint","head_sha":"$GH_HEAD_SHA","status":"completed","conclusion":"success","output":{"title":"WASM artifact verified","summary":"Package checksums verified by the build workflow; the standard PR suite does not run on packages/*-wasm diffs."}}
          EOF
          curl -sfS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/check-run.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs"
