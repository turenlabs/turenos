name: Build binary-diff WASM

on:
  push:
    branches: [dev, main]
    paths:
      - ".github/workflows/build-binary-diff.yml"
      - "tools/binary-diff/**"
  workflow_dispatch:

concurrency:
  group: wasm-binary-diff
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  RUST_TOOLCHAIN: 1.97.1
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout Turen build repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24

      - name: Install pinned wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - name: Run Rust tests
        run: cargo +"$RUST_TOOLCHAIN" test --manifest-path tools/binary-diff/Cargo.toml --locked

      - name: Build binary-diff WASM
        run: wasm-pack build tools/binary-diff --target web --release --out-dir pkg
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}

      - name: Pack Forge workspace artifact
        run: node tools/binary-diff/script/pack.mjs tools/binary-diff/pkg packages/binary-diff-wasm

      - name: Verify packaged differencing API
        run: node tools/binary-diff/test/verify.mjs packages/binary-diff-wasm/dist

      - name: Verify artifact checksums
        run: cd packages/binary-diff-wasm && (shasum -a 256 -c SHA256SUMS || sha256sum -c SHA256SUMS)

      - name: Open package update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: packages/binary-diff-wasm
          branch: wasm/binary-diff-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild binary-diff-wasm"
          title: "chore(wasm): rebuild binary-diff-wasm"
          body: "Rebuilt `packages/binary-diff-wasm` from `tools/binary-diff` at ${{ github.sha }}."
