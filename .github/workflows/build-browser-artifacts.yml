name: Build browser-artifacts WASM

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/build-browser-artifacts.yml"
      - "tools/browser-artifacts/**"
  workflow_dispatch:

concurrency:
  group: wasm-browser-artifacts
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  RUST_TOOLCHAIN: 1.97.1
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout Turen build repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24

      - name: Install pinned wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - name: Run Rust tests
        run: cargo +"$RUST_TOOLCHAIN" test --manifest-path tools/browser-artifacts/Cargo.toml --locked

      - name: Build browser-artifacts WASM
        run: wasm-pack build tools/browser-artifacts --target web --release --out-dir pkg
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}

      - name: Pack Forge workspace artifact
        run: node tools/browser-artifacts/script/pack.mjs tools/browser-artifacts/pkg packages/browser-artifacts-wasm

      - name: Verify packaged browser artifact parser API
        run: node tools/browser-artifacts/test/verify.mjs packages/browser-artifacts-wasm/dist

      - name: Verify artifact checksums
        run: cd packages/browser-artifacts-wasm && (shasum -a 256 -c SHA256SUMS || sha256sum -c SHA256SUMS)

      - name: Open package update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: packages/browser-artifacts-wasm
          branch: wasm/browser-artifacts-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild browser-artifacts-wasm"
          title: "chore(wasm): rebuild browser-artifacts-wasm"
          body: "Rebuilt `packages/browser-artifacts-wasm` from `tools/browser-artifacts` at ${{ github.sha }}."
