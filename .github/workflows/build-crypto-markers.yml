name: Build Crypto Markers WASM

on:
  push:
    branches: [main]
    paths:
      - "tools/crypto-markers/**"
  workflow_dispatch:

concurrency:
  group: wasm-crypto-markers
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  RUST_TOOLCHAIN: 1.97.1
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout Turen build repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24

      - name: Install pinned wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - name: Run Rust unit tests
        run: cargo test --manifest-path tools/crypto-markers/Cargo.toml
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}

      - name: Build Crypto Markers WASM
        run: wasm-pack build tools/crypto-markers --target web --release --out-dir pkg
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}

      - name: Verify bounded crypto-marker API on real WASM
        run: node tools/crypto-markers/test/verify.mjs tools/crypto-markers/pkg

      - name: Pack Forge workspace artifact
        run: node tools/crypto-markers/script/pack.mjs tools/crypto-markers/pkg packages/crypto-markers-wasm

      - name: Verify packaged artifact on real WASM
        run: node tools/crypto-markers/test/verify.mjs packages/crypto-markers-wasm/dist

      - name: Verify package hashes
        working-directory: packages/crypto-markers-wasm
        run: shasum -a 256 -c SHA256SUMS

      - name: Open package update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: packages/crypto-markers-wasm
          branch: wasm/crypto-markers-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild crypto-markers-wasm"
          title: "chore(wasm): rebuild crypto-markers-wasm"
          body: "Rebuilt `packages/crypto-markers-wasm` from `tools/crypto-markers` at ${{ github.sha }}."
