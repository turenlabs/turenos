name: Build apk-dex WASM

on:
  push:
    branches: [dev, main]
    paths:
      - ".github/workflows/build-apk-dex.yml"
      - "tools/apk-dex/**"
  workflow_dispatch:

concurrency:
  group: wasm-apk-dex
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  RUST_TOOLCHAIN: 1.97.1
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout Turen build repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24

      - name: Install pinned wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - name: Run Rust unit tests
        run: cargo +"$RUST_TOOLCHAIN" test --manifest-path tools/apk-dex/Cargo.toml --locked

      - name: Build apk-dex WASM
        run: wasm-pack build tools/apk-dex --target web --release --out-dir pkg
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}

      - name: Verify bounded inspection API
        run: node tools/apk-dex/test/verify.mjs tools/apk-dex/pkg

      - name: Pack Forge workspace artifact
        run: node tools/apk-dex/script/pack.mjs tools/apk-dex/pkg packages/apk-dex-wasm

      - name: Verify package hashes
        working-directory: packages/apk-dex-wasm
        run: shasum -a 256 -c SHA256SUMS

      - name: Open package update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: packages/apk-dex-wasm
          branch: wasm/apk-dex-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild apk-dex-wasm"
          title: "chore(wasm): rebuild apk-dex-wasm"
          body: "Rebuilt `packages/apk-dex-wasm` from `tools/apk-dex` at ${{ github.sha }}."
