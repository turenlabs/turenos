name: Build email authentication WASM

on:
  push:
    branches: [dev, main]
    paths:
      - "tools/email-authenticate/**"
      - ".github/workflows/build-email-authenticate.yml"
  workflow_dispatch:

concurrency:
  group: wasm-email-authenticate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  RUST_TOOLCHAIN: 1.94.0
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24
      - name: Install wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"
      - name: Check and build
        run: |
          cargo test --locked --manifest-path tools/email-authenticate/Cargo.toml --lib
          cargo check --locked --manifest-path tools/email-authenticate/Cargo.toml --target wasm32-unknown-unknown
          wasm-pack build tools/email-authenticate --target web --release --out-dir pkg
      - name: Verify
        run: node tools/email-authenticate/test/verify.mjs tools/email-authenticate/pkg
      - name: Pack
        run: node tools/email-authenticate/script/pack.mjs tools/email-authenticate/pkg packages/email-authenticate-wasm
      - name: Verify checksums
        working-directory: packages/email-authenticate-wasm
        run: shasum -a 256 -c SHA256SUMS

      - name: Open package update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: packages/email-authenticate-wasm
          branch: wasm/email-authenticate-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild email-authenticate-wasm"
          title: "chore(wasm): rebuild email-authenticate-wasm"
          body: "Rebuilt `packages/email-authenticate-wasm` from `tools/email-authenticate` at ${{ github.sha }}."
