name: Build sourcemap WASM

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/build-sourcemap.yml"
      - "tools/sourcemap/**"
  workflow_dispatch:

concurrency:
  group: wasm-sourcemap
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  RUST_TOOLCHAIN: 1.97.1
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout Turen build repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24

      - name: Install pinned wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - name: Run locked Rust tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked --manifest-path tools/sourcemap/Cargo.toml

      - name: Build sourcemap WASM
        run: wasm-pack build tools/sourcemap --target web --release --out-dir pkg
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}

      - name: Verify bounded source-map API
        run: node tools/sourcemap/test/verify.mjs tools/sourcemap/pkg

      - name: Pack Forge workspace artifact
        run: node tools/sourcemap/script/pack.mjs tools/sourcemap/pkg packages/sourcemap-wasm

      - name: Verify packaged artifact
        run: node tools/sourcemap/test/verify.mjs packages/sourcemap-wasm/dist

      - name: Verify checksum manifest
        run: cd packages/sourcemap-wasm && shasum -a 256 -c SHA256SUMS

      - name: Open package update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: packages/sourcemap-wasm
          branch: wasm/sourcemap-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild sourcemap-wasm"
          title: "chore(wasm): rebuild sourcemap-wasm"
          body: "Rebuilt `packages/sourcemap-wasm` from `tools/sourcemap` at ${{ github.sha }}."
