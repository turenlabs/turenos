name: Build static analysis WASM

on:
  push:
    branches: [dev, main]
    paths:
      - ".github/workflows/build-static-analysis.yml"
      - "tools/static-analysis/**"
  workflow_dispatch:

concurrency:
  group: wasm-static-analysis
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  RUST_TOOLCHAIN: 1.97.1
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout Turen build repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24

      - name: Install pinned wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - name: Build static analysis WASM
        run: wasm-pack build tools/static-analysis --target web --release --out-dir pkg
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
          RUSTFLAGS: "-C link-arg=--max-memory=268435456"

      - name: Verify parser regressions
        run: cargo +"$RUST_TOOLCHAIN" test --locked --manifest-path tools/static-analysis/Cargo.toml

      - name: Verify bounded analysis API
        run: node tools/static-analysis/test/verify.mjs tools/static-analysis/pkg

      - name: Pack Forge workspace artifact
        run: node tools/static-analysis/script/pack.mjs tools/static-analysis/pkg packages/static-analysis-wasm tools/static-analysis/LICENSE

      - name: Verify package hashes
        working-directory: packages/static-analysis-wasm
        run: shasum -a 256 -c SHA256SUMS.extensions

      - name: Open package update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: packages/static-analysis-wasm
          branch: wasm/static-analysis-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild static-analysis-wasm"
          title: "chore(wasm): rebuild static-analysis-wasm"
          body: "Rebuilt `packages/static-analysis-wasm` from `tools/static-analysis` at ${{ github.sha }}."
