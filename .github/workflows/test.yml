# Complete cross-platform coverage, partitioned into jobs with a five-minute budget.
name: test

on:
  push:
    branches: [main, "release-*"]
    paths-ignore: ["tools/**", "services/**", "docs/**"]
  pull_request:
    paths-ignore: ["tools/**", "services/**", "docs/**", "packages/*-wasm/**"]
  merge_group:
  workflow_dispatch:
  workflow_call:

concurrency:
  # Keep reusable test cancellation separate from the caller workflow.
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  affected-tests:
    name: Affected test plan (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Report affected test packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base=__missing_ci_base__
          fi
          bun packages/script/src/test-affected.ts --base "$base" --head "$HEAD_SHA" --json > "$RUNNER_TEMP/affected-tests.json"
          node -e 'const fs = require("node:fs"); const plan = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Affected test plan (informational)\n\nSelected ${plan.selected.length} test package(s). This plan does not run tests or change CI gates.\n\n\`\`\`json\n${JSON.stringify(plan, null, 2)}\n\`\`\`\n`)' "$RUNNER_TEMP/affected-tests.json"

  unit:
    name: ${{ matrix.name }}
    # Windows shards lose minutes to slow setup phases; keep Linux tight.
    timeout-minutes: ${{ matrix.timeout || 10 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: "core (1/3)",
              host: blacksmith-4vcpu-ubuntu-2404,
              github_host: ubuntu-latest,
              directory: packages/core,
              command: "bun run test --shard=1/3",
            }
          - {
              name: "core (2/3)",
              host: blacksmith-4vcpu-ubuntu-2404,
              github_host: ubuntu-latest,
              directory: packages/core,
              command: "bun run test --shard=2/3",
            }
          - {
              name: "core (3/3)",
              host: blacksmith-4vcpu-ubuntu-2404,
              github_host: ubuntu-latest,
              directory: packages/core,
              command: "bun run test --shard=3/3",
            }
          - {
              name: "forge (1/4)",
              host: blacksmith-4vcpu-ubuntu-2404,
              github_host: ubuntu-latest,
              directory: packages/forge,
              command: "bun run test --shard=1/4",
            }
          - {
              name: "forge (2/4)",
              host: blacksmith-4vcpu-ubuntu-2404,
              github_host: ubuntu-latest,
              directory: packages/forge,
              command: "bun run test --shard=2/4",
            }
          - {
              name: "forge (3/4)",
              host: blacksmith-4vcpu-ubuntu-2404,
              github_host: ubuntu-latest,
              directory: packages/forge,
              command: "bun run test --shard=3/4",
            }
          - {
              name: "forge (4/4)",
              host: blacksmith-4vcpu-ubuntu-2404,
              github_host: ubuntu-latest,
              directory: packages/forge,
              command: "bun run test --shard=4/4",
            }
          - {
              name: "desktop",
              host: blacksmith-4vcpu-ubuntu-2404,
              github_host: ubuntu-latest,
              directory: packages/desktop,
              command: "bun run test",
            }
          - {
              name: "tui",
              host: blacksmith-4vcpu-ubuntu-2404,
              github_host: ubuntu-latest,
              directory: packages/tui,
              command: "bun run test",
            }
          - {
              name: "packages (linux)",
              host: blacksmith-4vcpu-ubuntu-2404,
              github_host: ubuntu-latest,
              directory: ".",
              command: "bun .github/scripts/test-packages.ts",
            }
          - {
              name: "unit (windows 1/2)",
              host: blacksmith-4vcpu-windows-2025,
              github_host: windows-latest,
              directory: ".",
              command: "bun .github/scripts/test-packages.ts --shard=1/2",
              transport: true,
              timeout: 20,
            }
          - {
              name: "unit (windows 2/2)",
              host: blacksmith-4vcpu-windows-2025,
              github_host: windows-latest,
              directory: ".",
              command: "bun .github/scripts/test-packages.ts --shard=2/2",
              timeout: 20,
            }
    runs-on: ${{ github.repository == 'turenlabs/turenos' && matrix.github_host || matrix.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          # Keep the existing Windows hoisted install; Bun rewrites its platform lock metadata.
          install-flags: >-
            ${{ runner.os != 'Windows' && '--frozen-lockfile' ||
            '--filter ./packages/app --filter ./packages/client --filter ./packages/codemode
            --filter ./packages/effect-drizzle-sqlite --filter ./packages/extensions
            --filter ./packages/http-recorder --filter ./packages/httpapi-codegen
            --filter ./packages/llm --filter ./packages/plugin --filter ./packages/protocol
            --filter ./packages/schema --filter ./packages/script
            --filter ./packages/sdk/js --filter ./packages/sdk-next --filter ./packages/server
            --filter ./packages/session-ui --filter ./packages/ui' }}
          # Use a cold cache on the checkout volume; validate misses against the same budget.
          # Keep installation scripts; only omit cache transport.
          dependency-cache: ${{ runner.os != 'Windows' }}

      - name: Configure git identity
        run: |
          git config --global user.email "bot@turen.dev"
          git config --global user.name "turen"

      - name: Verify complete suite inventory
        run: bun .github/scripts/test-packages.ts --verify

      - name: Run unit tests
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}
        env:
          GITHUB_ACTIONS: "false"
          FORGE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      # Exercise the actual Node HTTP transport on Windows without loading the
      # POSIX-only Forge suite preload. The file also remains in the Forge shards.
      - name: Verify Windows client disconnects
        if: runner.os == 'Windows' && matrix.transport == true
        working-directory: packages/script
        run: bun test ../forge/test/server/client-disconnect.test.ts --timeout 20000

  httpapi:
    name: HTTP API (${{ matrix.name }})
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: coverage, arguments: "--mode coverage" }
          - { name: auth, arguments: "--mode auth" }
          - { name: "effect 1/3", arguments: "--mode effect --shard 1/3" }
          - { name: "effect 2/3", arguments: "--mode effect --shard 2/3" }
          - { name: "effect 3/3", arguments: "--mode effect --shard 3/3" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Configure git identity
        run: |
          git config --global user.email "bot@turen.dev"
          git config --global user.name "turen"
      - name: Run HttpApi gate
        working-directory: packages/forge
        run: bun run test:httpapi ${{ matrix.arguments }}

  generated:
    name: Generated client
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated
      - name: Check generated extension catalog
        working-directory: packages/extensions
        run: bun run check

  bun-runtime:
    name: Bun backend (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-24.04 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: macos-x64, runner: macos-15-intel }
          - { name: macos-arm64, runner: macos-15 }
          - { name: windows-x64, runner: windows-2025 }
          - { name: windows-arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify native runner architecture
        run: |
          node -e 'const expected = { "linux-x64": ["linux", "x64"], "linux-arm64": ["linux", "arm64"], "macos-x64": ["darwin", "x64"], "macos-arm64": ["darwin", "arm64"], "windows-x64": ["win32", "x64"], "windows-arm64": ["win32", "arm64"] }[process.env.TARGET]; if (process.platform !== expected[0] || process.arch !== expected[1]) throw new Error(`Expected ${expected}, got ${process.platform}/${process.arch}`)'
        env:
          TARGET: ${{ matrix.name }}
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
          # Restoring the cache takes longer than downloading on Windows, as in the unit jobs above.
          dependency-cache: ${{ runner.os != 'Windows' }}
      - name: Verify Bun native terminal
        run: bun --cwd packages/script test ../core/test/pty/native-terminal.test.ts --timeout 15000
      - name: Build Forge Bun backend
        run: bun run --cwd packages/forge script/build-node.ts
      - name: Stage Bun runtime
        run: bun run --cwd packages/desktop scripts/stage-bun.ts --unsigned
      - name: Bundle desktop sidecar entry
        run: bun run --cwd packages/desktop scripts/build-sidecar.ts
      - name: Smoke staged Bun backend
        run: node packages/desktop/scripts/smoke-bun-sidecar.mjs packages/desktop/resources packages/forge/dist/node
        env:
          TARGET: ${{ matrix.name }}

  test:
    name: test
    if: always()
    needs: [unit, httpapi, generated, bun-runtime]
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 1
    steps:
      - name: Require every suite and gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = Object.values(JSON.parse(process.env.RESULTS)); if (jobs.some(job => job.result !== "success")) process.exit(1)'
