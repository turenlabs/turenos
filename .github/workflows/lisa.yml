name: Lisa

# pull_request_target so fork PRs get secrets. Safe only because this job never
# checks out PR code — do not add a checkout step.
on:
  pull_request_target:
    paths-ignore: ["packages/*-wasm/**"]

concurrency:
  group: lisa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lisa:
    name: lisa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: turenlabs/lisa@6210c5311646df830cffe6bf5a5fe5b3d887c7e7 # v1.0.0
        with:
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
