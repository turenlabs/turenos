name: Build official libpcap WASM

on:
  push:
    branches: [main]
    paths:
      - "tools/libpcap/**"
  workflow_dispatch:

concurrency:
  group: wasm-libpcap
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  LIBPCAP_COMMIT: a999701dca5c873779281938baee6bc185a8d4dc
  EMSDK_VERSION: 6.0.8

jobs:
  build:
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 45
    steps:
      - name: Checkout Turen build repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Checkout official libpcap
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: the-tcpdump-group/libpcap
          ref: ${{ env.LIBPCAP_COMMIT }}
          path: upstream/libpcap
          persist-credentials: false

      - name: Install pinned CMake
        id: cmake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
        with:
          cmakeVersion: 3.31.6
          useCloudCache: false
          useLocalCache: true

      - name: Install parser generators
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24

      - name: Build official libpcap offline runtime
        run: bash tools/libpcap/script/build.sh
        env:
          CMAKE_BIN: ${{ steps.cmake.outputs.cmake-path }}

      - name: Verify bounded offline API
        run: node tools/libpcap/test/verify.mjs tools/libpcap/dist

      - name: Pack Forge workspace artifact
        run: node tools/libpcap/script/pack.mjs tools/libpcap/dist packages/libpcap-wasm upstream/libpcap

      - name: Open package update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: packages/libpcap-wasm
          branch: wasm/libpcap-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild libpcap-wasm"
          title: "chore(wasm): rebuild libpcap-wasm"
          body: "Rebuilt `packages/libpcap-wasm` from `tools/libpcap` at ${{ github.sha }}."
