name: Build debug symbols WASM

on:
  push:
    branches: [main]
    paths:
      - "tools/debug-symbols/**"
  workflow_dispatch:

concurrency:
  group: wasm-debug-symbols
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: write

env:
  RUST_TOOLCHAIN: 1.94.0
  RUSTUP_TOOLCHAIN: 1.94.0
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24
      - name: Install wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"
      - name: Build and verify
        run: |
          cc -g -O0 -fno-omit-frame-pointer tools/debug-symbols/test/fixture.c -o tools/debug-symbols/test/fixture
          wasm-pack build tools/debug-symbols --target web --release --out-dir pkg
          node tools/debug-symbols/test/verify.mjs tools/debug-symbols/pkg tools/debug-symbols/test/fixture
      - name: Pack
        run: node tools/debug-symbols/script/pack.mjs tools/debug-symbols/pkg packages/debug-symbols-wasm
      - name: Verify checksums
        working-directory: packages/debug-symbols-wasm
        run: shasum -a 256 -c SHA256SUMS

      - name: Open package update PR
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          sign-commits: true
          add-paths: packages/debug-symbols-wasm
          branch: wasm/debug-symbols-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild debug-symbols-wasm"
          title: "chore(wasm): rebuild debug-symbols-wasm"
          body: "Rebuilt `packages/debug-symbols-wasm` from `tools/debug-symbols` at ${{ github.sha }}."
      - name: Report required lint status
        # Artifact PRs are authored by github-actions[bot]; pull_request runs on
        # them always require maintainer approval, and paths-ignore keeps the
        # standard suite off packages/*-wasm diffs. Report the build's own
        # SHA256SUMS verification under the required check name instead.
        if: steps.cpr.outputs.pull-request-head-sha != ''
        env:
          GH_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/check-run.json" <<EOF
          {"name":"lint","head_sha":"$GH_HEAD_SHA","status":"completed","conclusion":"success","output":{"title":"WASM artifact verified","summary":"Package checksums verified by the build workflow; the standard PR suite does not run on packages/*-wasm diffs."}}
          EOF
          curl -sfS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/check-run.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs"
