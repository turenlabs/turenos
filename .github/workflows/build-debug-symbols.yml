name: Build debug symbols WASM

on:
  push:
    branches: [dev]
    paths:
      - "tools/debug-symbols/**"
      - ".github/workflows/build-debug-symbols.yml"
  workflow_dispatch:

concurrency:
  group: wasm-debug-symbols
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  RUST_TOOLCHAIN: 1.94.0
  RUSTUP_TOOLCHAIN: 1.94.0
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24
      - name: Install wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"
      - name: Build and verify
        run: |
          cc -g -O0 -fno-omit-frame-pointer tools/debug-symbols/test/fixture.c -o tools/debug-symbols/test/fixture
          wasm-pack build tools/debug-symbols --target web --release --out-dir pkg
          node tools/debug-symbols/test/verify.mjs tools/debug-symbols/pkg tools/debug-symbols/test/fixture
      - name: Pack
        run: node tools/debug-symbols/script/pack.mjs tools/debug-symbols/pkg packages/debug-symbols-wasm
      - name: Verify checksums
        working-directory: packages/debug-symbols-wasm
        run: shasum -a 256 -c SHA256SUMS

      - name: Open package update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: packages/debug-symbols-wasm
          branch: wasm/debug-symbols-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild debug-symbols-wasm"
          title: "chore(wasm): rebuild debug-symbols-wasm"
          body: "Rebuilt `packages/debug-symbols-wasm` from `tools/debug-symbols` at ${{ github.sha }}."
