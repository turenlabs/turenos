# TurenOS typecheck gate.
name: typecheck

on:
  push:
    branches: [dev, main]
    paths-ignore: ["tools/**", "services/**", "docs/**"]
  pull_request:
    branches: [dev, main]
    paths-ignore: ["tools/**", "services/**", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        # Core and Forge each need several GiB; do not overlap them on a hosted runner.
        run: bun turbo typecheck --concurrency=1
