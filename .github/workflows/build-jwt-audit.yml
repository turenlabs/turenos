name: Build jwt-audit WASM

on:
  push:
    branches: [main]
    paths: ["tools/jwt-audit/**"]
  workflow_dispatch:

concurrency:
  group: wasm-jwt-audit
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: write

env:
  RUST_TOOLCHAIN: 1.97.1
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install pinned wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"
      - name: Test and build
        run: |
          cargo +"$RUST_TOOLCHAIN" test --locked --manifest-path tools/jwt-audit/Cargo.toml
          wasm-pack build tools/jwt-audit --target web --release --out-dir pkg
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
      - name: Pack and verify
        run: |
          node tools/jwt-audit/script/pack.mjs tools/jwt-audit/pkg packages/jwt-audit-wasm
          node tools/jwt-audit/test/verify.mjs packages/jwt-audit-wasm/dist
          cd packages/jwt-audit-wasm && sha256sum -c SHA256SUMS
      - name: Open package update PR
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          sign-commits: true
          add-paths: packages/jwt-audit-wasm
          branch: jwt-audit-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild jwt-audit-wasm"
          title: "chore(wasm): rebuild jwt-audit-wasm"
          body: "Rebuilt JWT WASM from source at ${{ github.sha }}. Verified real signatures, policy failures, malformed input, licenses, and checksums."
      - name: Report artifact checksum check
        if: steps.cpr.outputs.pull-request-head-sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=lint -f head_sha="$HEAD_SHA" -f status=completed -f conclusion=success \
            -f 'output[title]=WASM artifact verified' \
            -f 'output[summary]=JWT signatures, isolated packaged workers, and artifact checksums passed.'
