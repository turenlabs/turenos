name: Build code-signing WASM

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/build-code-signing.yml"
      - "tools/code-signing/**"
  workflow_dispatch:

concurrency:
  group: wasm-code-signing
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  RUST_TOOLCHAIN: 1.97.1
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout Turen build repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24

      - name: Install pinned wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - name: Run Rust tests
        run: cargo +"$RUST_TOOLCHAIN" test --manifest-path tools/code-signing/Cargo.toml --locked

      - name: Build code-signing WASM
        run: wasm-pack build tools/code-signing --target web --release --out-dir pkg
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}

      - name: Pack Forge workspace artifact
        run: node tools/code-signing/script/pack.mjs tools/code-signing/pkg packages/code-signing-wasm

      - name: Verify packaged inspection API
        run: node tools/code-signing/test/verify.mjs packages/code-signing-wasm/dist

      - name: Verify artifact checksums
        run: cd packages/code-signing-wasm && (shasum -a 256 -c SHA256SUMS || sha256sum -c SHA256SUMS)

      - name: Open package update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: packages/code-signing-wasm
          branch: wasm/code-signing-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild code-signing-wasm"
          title: "chore(wasm): rebuild code-signing-wasm"
          body: "Rebuilt `packages/code-signing-wasm` from `tools/code-signing` at ${{ github.sha }}."
