# Lint, dependency audit, and license checks. test.yml owns the complete test matrix.
name: pr

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # oxlint exits non-zero on errors only. The tree carries thousands of
      # warnings today, so promoting them here would make every PR red on
      # arrival and teach people to ignore the check.
      - name: Run lint
        run: bun run lint

      - name: Verify packaged WASM checksums
        run: bun run verify:wasm

      - name: Check third-party license inventory
        run: bun run license:check

      - name: Audit dependencies
        run: bun audit
