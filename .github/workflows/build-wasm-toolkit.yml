name: Build wasm-toolkit WASM

on:
  push:
    branches: [main]
    paths:
      - "tools/wasm-toolkit/**"
  workflow_dispatch:

concurrency:
  group: wasm-wasm-toolkit
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  RUST_TOOLCHAIN: 1.97.1
  WASM_PACK_VERSION: 0.15.0

jobs:
  build:
    runs-on: ${{ github.repository == 'turenlabs/turenos' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - name: Checkout Turen build repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 24

      - name: Install pinned wasm-pack
        run: cargo +"$RUST_TOOLCHAIN" install --locked wasm-pack --version "$WASM_PACK_VERSION"

      - name: Run Rust unit tests
        run: cargo +"$RUST_TOOLCHAIN" test --manifest-path tools/wasm-toolkit/Cargo.toml --locked

      - name: Build wasm-toolkit WASM
        run: wasm-pack build tools/wasm-toolkit --target web --release --out-dir pkg
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}

      - name: Verify bounded toolkit API
        run: node tools/wasm-toolkit/test/verify.mjs tools/wasm-toolkit/pkg

      - name: Pack Forge workspace artifact
        run: node tools/wasm-toolkit/script/pack.mjs tools/wasm-toolkit/pkg packages/wasm-toolkit-wasm

      - name: Verify package hashes
        working-directory: packages/wasm-toolkit-wasm
        run: shasum -a 256 -c SHA256SUMS

      - name: Open package update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: packages/wasm-toolkit-wasm
          branch: wasm/wasm-toolkit-rebuild
          delete-branch: true
          commit-message: "chore(wasm): rebuild wasm-toolkit-wasm"
          title: "chore(wasm): rebuild wasm-toolkit-wasm"
          body: "Rebuilt `packages/wasm-toolkit-wasm` from `tools/wasm-toolkit` at ${{ github.sha }}."
